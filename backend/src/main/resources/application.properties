spring.application.name=event-feedback-backend
server.port=2222

spring.datasource.url=jdbc:mariadb://localhost:3306/eventintership
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.upload.dir=uploads/events


# Enable or disable OpenAPI definition generation (Default: true)
springdoc.api-docs.enabled=true

# Change the default JSON/YAML API documentation path (Default: /v3/api-docs)
springdoc.api-docs.path=/v3/api-docs

# Enable or disable the Swagger UI HTML console (Default: true)
springdoc.swagger-ui.enabled=true

# Change the default Swagger UI path (Default: /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html